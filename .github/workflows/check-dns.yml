name: Temporary DNS diagnosis
on:
  push:
    paths:
      - '.github/workflows/check-dns.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check public DNS and HTTPS
        run: |
          echo '--- Authoritative nameservers ---'
          dig +short NS quillandspine.com
          echo '--- Google public DNS: CNAME ---'
          dig @8.8.8.8 +time=5 +tries=1 bios.quillandspine.com CNAME
          echo '--- Cloudflare public DNS: CNAME ---'
          dig @1.1.1.1 +time=5 +tries=1 bios.quillandspine.com CNAME
          echo '--- Public DNS status ---'
          dig @8.8.8.8 +time=5 +tries=1 bios.quillandspine.com A
          echo '--- HTTPS check ---'
          curl -IL --max-time 15 https://bios.quillandspine.com/ || true
